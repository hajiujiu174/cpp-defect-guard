name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_projects:
        description: Run the locked real C/C++ project acceptance suite
        type: boolean
        default: false
      real_repairs:
        description: Replay both pinned libgit2 cases and negative controls on separate runners
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows x64 build, test and package
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cache verified dependency archives
        id: package-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/codeguard-package-cache
          key: windows-mingw64-${{ hashFiles('config/windows-toolchain.lock.json') }}
      - name: Restore locked native toolchain
        run: ./scripts/restore_windows_toolchain.ps1 -Destination "$env:RUNNER_TEMP/codeguard-toolchain" -PackageCache "$env:RUNNER_TEMP/codeguard-package-cache"
      - name: Save verified package archives before building
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/codeguard-package-cache
          key: windows-mingw64-${{ hashFiles('config/windows-toolchain.lock.json') }}
      - name: Verify toolchain restore guards
        run: ./tests/windows/restore_tests.ps1
      - name: Verify failed builds preserve caller environment
        run: ./tests/windows/ci_environment_tests.ps1 -ToolchainRoot "$env:RUNNER_TEMP/codeguard-toolchain"
      - name: Verify real repair reference and process evidence
        run: python -m unittest discover -s tests -p 'test_real_repair*.py' -v
      - name: Verify unlabeled graph inference interface without model dependencies
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'src'
          python -B -m unittest discover -s tests -p 'test_graph_inference.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Graph inference interface tests failed' }
      - name: Core debug build and tests
        run: ./scripts/ci_windows.ps1 -ToolchainRoot "$env:RUNNER_TEMP/codeguard-toolchain" -Mode Core
      - name: Clang and Qt release build, tests and package
        run: ./scripts/ci_windows.ps1 -ToolchainRoot "$env:RUNNER_TEMP/codeguard-toolchain" -Mode Analysis -Package
      - name: Real C and C++ project acceptance
        if: (github.event_name == 'workflow_dispatch' && inputs.real_projects) || github.ref == 'refs/heads/codex/p2-p3-independent-ci-20261027' || github.ref == 'refs/heads/codex/p3-worktree-benchmark-20261028'
        run: python scripts/accept_real_projects.py --cli build/windows-ci-analysis/codeguard-cli.exe --toolchain "$env:RUNNER_TEMP/codeguard-toolchain" --output artifacts/real-projects
      - name: Preserve real project acceptance evidence
        if: always() && ((github.event_name == 'workflow_dispatch' && inputs.real_projects) || github.ref == 'refs/heads/codex/p2-p3-independent-ci-20261027' || github.ref == 'refs/heads/codex/p3-worktree-benchmark-20261028')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-real-projects
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/real-projects/*.json
            artifacts/real-projects/*/*.json
            artifacts/real-projects/*/*.log
            artifacts/real-projects/*/*.sqlite3
            artifacts/real-projects/*/upstream-LICENSE.txt
            artifacts/real-projects/*/selected/*.json
            artifacts/real-projects/*/configure/compile_commands.json
            artifacts/real-projects/*/runs/*/*.log
            artifacts/real-projects/*/runs/*/*.txt
            artifacts/real-projects/*/runs/*/tests.xml
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-ci-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/windows-ci/**/*.log
            artifacts/windows-ci/**/*.json
            artifacts/windows-ci/**/tests.xml
            artifacts/windows-ci/**/*.png
            build/windows-ci-*/CMakeCache.txt
            build/windows-ci-*/CMakeFiles/CMakeConfigureLog.yaml
            build/windows-ci-*/Testing/Temporary/*.log
            build/windows-ci-*/tests/codeguard/**/*.png
      - name: Upload tested Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CodeGuard-Windows-x64
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/windows-ci/CodeGuard-Windows-x64.zip
            artifacts/windows-ci/CodeGuard-Windows-x64.zip.sha256
      - name: Upload the matching real repair proposal helper
        if: (github.event_name == 'workflow_dispatch' && inputs.real_repairs) || github.ref == 'refs/heads/codex/p2-p3-independent-ci-20261027' || github.ref == 'refs/heads/codex/p3-worktree-benchmark-20261028'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-real-repair-helper
          retention-days: 14
          if-no-files-found: error
          path: build/windows-ci-analysis/tests/codeguard/codeguard-real-proposal-helper.exe

  real-repair:
    name: Pinned repair and negative control (${{ matrix.case }})
    if: (github.event_name == 'workflow_dispatch' && inputs.real_repairs) || github.ref == 'refs/heads/codex/p2-p3-independent-ci-20261027' || github.ref == 'refs/heads/codex/p3-worktree-benchmark-20261028'
    needs: build-test
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        case: [libgit2-error-return, libgit2-worktree-return]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/codeguard-package-cache
          key: windows-mingw64-${{ hashFiles('config/windows-toolchain.lock.json') }}
      - name: Restore locked native toolchain
        run: ./scripts/restore_windows_toolchain.ps1 -Destination "$env:RUNNER_TEMP/codeguard-toolchain" -PackageCache "$env:RUNNER_TEMP/codeguard-package-cache"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CodeGuard-Windows-x64
          path: artifacts/real-repair-package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-real-repair-helper
          path: artifacts/real-repair-helper
      - name: Fetch the two pinned upstream commits
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $case=Get-Content 'benchmarks/${{ matrix.case }}/manifest.json' -Raw | ConvertFrom-Json
          $store=Join-Path $env:RUNNER_TEMP 'cg-upstream.git'
          & git init --bare $store
          if($LASTEXITCODE -ne 0){throw 'Cannot create upstream object store'}
          & git -c http.sslBackend=openssl -C $store fetch --no-tags --depth=1 $case.repository $case.buggy_commit $case.fixed_commit
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch the two pinned upstream commits'}
      - name: Replay with fresh scan and proposals
        timeout-minutes: 150
        run: |
          $ErrorActionPreference='Stop'
          $archive='artifacts/real-repair-package/CodeGuard-Windows-x64.zip'
          $expected=(Get-Content "$archive.sha256").Split(' ')[0]
          if((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected){throw 'Archive checksum mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath artifacts/real-repair-package/unpacked
          $store=Join-Path $env:RUNNER_TEMP 'cg-upstream.git'
          $toolchain=Join-Path $env:RUNNER_TEMP 'codeguard-toolchain'
          $cli=Join-Path $PWD 'artifacts/real-repair-package/unpacked/CodeGuard-Windows-x64/codeguard-cli.exe'
          $helper=Join-Path $PWD 'artifacts/real-repair-helper/codeguard-real-proposal-helper.exe'
          & python scripts/accept_real_repair.py --case '${{ matrix.case }}' --cli $cli --proposal-helper $helper --repository $store --toolchain $toolchain --output "$env:RUNNER_TEMP/cgr"
          $replayExit=$LASTEXITCODE
          [ordered]@{exit_code=$replayExit;finished_utc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/cg-real-replay-process.json" -Encoding utf8
          if($replayExit -ne 0){throw "Real repair acceptance failed ($replayExit); inspect windows-real-repair diagnostics"}
      - name: Preserve real repair diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-real-repair-${{ matrix.case }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/cg-real-replay-process.json
            ${{ runner.temp }}/cgr/*.json
            ${{ runner.temp }}/cgr/*.log
            ${{ runner.temp }}/cgr/*.xml
            ${{ runner.temp }}/cgr/a*/**/*.json
            ${{ runner.temp }}/cgr/a*/**/*.log
            ${{ runner.temp }}/cgr/a*/**/*.xml
            ${{ runner.temp }}/cgr/a*/**/*.cgfix
            ${{ runner.temp }}/cgr/a*/**/*.cgset
            ${{ runner.temp }}/cgr/a*/**/*.diff
            ${{ runner.temp }}/cgr/a*/evidence/**
            ${{ runner.temp }}/cgr/a*/scan.db
            ${{ runner.temp }}/cgr/b/compile_commands.json
            ${{ runner.temp }}/cgr/fb/compile_commands.json
            ${{ runner.temp }}/cgr/s/COPYING
            ${{ runner.temp }}/cgr/s/AUTHORS

  verify-repair-evidence:
    name: Verify restored repair evidence (${{ matrix.case }})
    needs: real-repair
    if: (github.event_name == 'workflow_dispatch' && inputs.real_repairs) || github.ref == 'refs/heads/codex/p2-p3-independent-ci-20261027' || github.ref == 'refs/heads/codex/p3-worktree-benchmark-20261028'
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case: [libgit2-error-return, libgit2-worktree-return]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-real-repair-${{ matrix.case }}
          path: artifacts/restored-repair-evidence
      - name: Verify restored candidate and diff bytes
        run: |
          $ErrorActionPreference='Stop'
          $root='artifacts/restored-repair-evidence/cgr'
          $latest=Get-Content "$root/latest-acceptance.json" -Raw | ConvertFrom-Json
          if($latest.attempt -notmatch '^a[0-9]+$'){throw 'Invalid attempt name'}
          $attempt=Join-Path $root $latest.attempt
          $result=Get-Content "$attempt/acceptance.json" -Raw | ConvertFrom-Json
          if($result.status -ne 'passed'){throw 'Replay did not pass'}
          $case=Get-Content 'benchmarks/${{ matrix.case }}/manifest.json' -Raw | ConvertFrom-Json
          if($result.case.id -ne $case.id -or $result.case.buggy_commit -ne $case.buggy_commit -or $result.case.fixed_commit -ne $case.fixed_commit){throw 'Downloaded evidence belongs to a different case'}
          $verified=& python scripts/real_repair_evidence.py --verify "$attempt/evidence"
          if($LASTEXITCODE -ne 0){throw 'Restored proposal evidence verification failed'}
          $receipt=$verified | ConvertFrom-Json
          if($receipt.manifest_sha256 -ne $result.evidence.manifest_sha256 -or $receipt.proposals -ne $result.evidence.proposals -or $receipt.sets -ne $result.evidence.sets -or $receipt.files -ne $result.evidence.files){throw 'Evidence does not match the completed replay'}
          $receipt | ConvertTo-Json | Set-Content artifacts/restored-repair-evidence/result.json -Encoding utf8
      - name: Preserve restored evidence verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-real-repair-evidence-qa-${{ matrix.case }}
          retention-days: 14
          if-no-files-found: warn
          path: artifacts/restored-repair-evidence/result.json

  clean-runtime:
    name: Fresh Windows runner package smoke test
    needs: build-test
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CodeGuard-Windows-x64
          path: artifacts/download
      - name: Verify and unpack package
        run: |
          $archive='artifacts/download/CodeGuard-Windows-x64.zip'
          $expected=(Get-Content "$archive.sha256").Split(' ')[0]
          if((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected){throw 'Archive checksum mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath artifacts/unpacked
      - name: Run without the build toolchain
        run: ./scripts/verify_codeguard_package.ps1 -Package artifacts/unpacked/CodeGuard-Windows-x64 -Output artifacts/clean-runtime-qa
      - name: Preserve runtime verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-clean-runtime-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/clean-runtime-qa/*.log
            artifacts/clean-runtime-qa/*.json
            artifacts/clean-runtime-qa/*.png
